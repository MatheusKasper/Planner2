<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗓️</text></svg>">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#04050c;--card:#0b1020;--card2:#0e1530;--tx:#dbe7ff;--mu:#7388ad;--ac:#3aa0ff;--ac2:#6a4cff;--ok:#35e0a1;--bd:#1b2a4d;--dg:#ff4d6d;--glow:rgba(58,160,255,.35);--on:#04101f;--navbg:rgba(4,5,12,.92);--bgfx:radial-gradient(900px 420px at 85% -80px,#14204a 0%,transparent 70%),radial-gradient(700px 400px at 0% 100%,#1b1038 0%,transparent 70%)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bgfx),var(--bg);background-attachment:fixed;color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font:400 2rem Georgia,"Times New Roman",serif;letter-spacing:.02em;margin:8px 0 2px}h1::after{content:"";display:block;width:40px;height:2px;background:var(--ac);margin-top:10px}h2{font:600 .74rem system-ui,-apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin:0 0 12px}.sub::first-letter{text-transform:uppercase}
.sub{color:var(--mu);font-size:.9rem;margin:0 0 14px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
nav button{flex:none;border:1px solid var(--bd);background:transparent;color:var(--mu);padding:8px 16px;border-radius:999px;font:inherit;font-size:.92rem;cursor:pointer;transition:.15s}nav button:hover{color:var(--tx);border-color:var(--ac2)}
nav button.on{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}input[type=checkbox]{accent-color:var(--ac);width:18px;height:18px}
input.grow{flex:1}
.btn{border:0;background:var(--ac);color:var(--on);font-weight:600;padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer}
.btn.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}
.btn.x{background:transparent;color:var(--dg);padding:4px 8px}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.done .t{text-decoration:line-through;color:var(--mu)}
.mu{color:var(--mu);font-size:.85rem}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:99px;transition:width .3s}
.bar i.ok{background:var(--ok)}
.empty{color:var(--mu);font-size:.9rem;padding:6px 0}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
svg text{fill:var(--mu);font-size:11px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);z-index:20}
#modal.on{display:flex}
#modal .bar2{display:flex;justify-content:space-between;padding:10px 14px;background:var(--card)}
#modal iframe{flex:1;border:0;background:#fff;width:100%}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.tp{text-align:left;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:12px;padding:10px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tp span{color:var(--mu);font-size:.78rem}
.tp.on{border-color:var(--ac);background:var(--glow)}
.chip{border:1px solid var(--bd);background:transparent;color:var(--mu);border-radius:999px;padding:5px 11px;font:inherit;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--tx)}
label.lb{display:block;font-size:.78rem;color:var(--mu);margin:12px 0 5px}
.cs{color:var(--mu);font-size:.75rem;margin:-6px 0 12px}
.big{font:400 1.5rem Georgia,"Times New Roman",serif}
.qt{border-left:3px solid var(--ac);padding:2px 0 2px 12px;margin:6px 0;white-space:pre-wrap;font-family:Georgia,serif;line-height:1.6}
.btn:disabled{opacity:.4;cursor:default}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.avbtn{background:none;border:0;padding:0;cursor:pointer;margin-top:6px;flex:none}
.av{border-radius:50%;object-fit:cover;background:var(--card2);display:inline-block;text-align:center;color:var(--ac);font-weight:600;flex:none;border:1px solid var(--bd)}
.ph{max-width:100%;max-height:420px;border-radius:12px;margin-top:8px;display:block}
details>summary{font-weight:600}
#bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--navbg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#bnav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}
#bnav button i{font-style:normal;font-size:1.35rem;line-height:1}
#bnav button.on{color:var(--ac)}
html{-webkit-text-size-adjust:100%}button{-webkit-tap-highlight-color:transparent}
@media(max-width:720px){
 #nav{display:none}
 #bnav{display:flex}
 .wrap{padding:12px 12px 100px}
 h1{font-size:1.7rem}
 input,select,textarea{font-size:16px}
 .btn,.chip{min-height:40px}
 .card{padding:14px;border-radius:14px}
 .grid{grid-template-columns:1fr}
 .row>input.grow,.row>div{min-width:0}
}
:root[data-theme="classico"]{--bg:#0e0d0c;--card:#1a1816;--card2:#211e1b;--tx:#ece6dd;--mu:#968c80;--ac:#c4895a;--ac2:#8b5e3c;--ok:#9bb07a;--bd:#2e2a26;--dg:#c9605a;--glow:rgba(196,137,90,.28);--on:#1a120a;--navbg:rgba(14,13,12,.92);--bgfx:radial-gradient(900px 420px at 85% -80px,#2a1f17 0%,transparent 70%)}
body{font-family:"Rajdhani","Segoe UI",system-ui,-apple-system,sans-serif;font-size:17px}
h1{font:700 2rem "Rajdhani","Segoe UI",sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:6px 0 0;text-shadow:0 0 18px var(--glow)}
h2{font:700 .82rem "Rajdhani","Segoe UI",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--ac);margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:3px;height:14px;background:var(--ac);box-shadow:0 0 8px var(--ac)}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 45%),var(--card);border:1px solid var(--bd);border-radius:6px;padding:16px;margin-bottom:14px;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 0 22px -8px var(--glow),inset 0 0 30px -22px var(--ac)}
.card::before,.card::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--ac);opacity:.85;pointer-events:none}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.btn{border-radius:4px;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;box-shadow:0 0 14px -4px var(--ac)}
.btn.g,.btn.x,.btn:disabled{box-shadow:none}
nav button,.chip,input,select,textarea{border-radius:4px}
nav button.on,.chip.on{box-shadow:0 0 14px -2px var(--ac)}
.zh{display:flex;align-items:center;gap:10px;margin:26px 0 10px;font:700 1rem "Rajdhani","Segoe UI",sans-serif;letter-spacing:.24em;text-transform:uppercase}
.zh::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ac),transparent)}
.hud{display:flex;gap:14px;align-items:center;padding:12px 14px;margin-bottom:14px;border:1px solid var(--ac);border-radius:6px;background:linear-gradient(90deg,var(--glow),transparent 70%);box-shadow:0 0 24px -8px var(--glow)}
.hud-av{border-radius:50%;padding:2px;border:2px solid currentColor;box-shadow:0 0 14px currentColor;display:flex;flex:none}
.hud-b{flex:1;min-width:0}
.hud-t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hud-l{font-size:.85rem;color:var(--mu);letter-spacing:.12em;text-transform:uppercase}.hud-l b{color:var(--tx);font-size:1.1rem}
.xpbar{height:10px;background:#050816;border:1px solid var(--bd);border-radius:2px;overflow:hidden;margin:6px 0 3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));box-shadow:0 0 12px var(--ac);transition:width .5s}
.hud-x{font-size:.75rem;color:var(--mu)}
.rk{font-weight:700;font-size:.72rem;letter-spacing:.18em;padding:1px 8px;border:1px solid currentColor;border-radius:3px;display:inline-block}
.rk-E{color:#8a96ad}.rk-D{color:#4cd48b}.rk-C{color:#3aa0ff}.rk-B{color:#a07bff}.rk-A{color:#ff9a3d}.rk-S{color:#ffc857;text-shadow:0 0 10px #ffc857}.rk-Monarca{color:#ff4fd8;text-shadow:0 0 10px #ff4fd8}
.quest{border-color:var(--ac2)}
.qh{display:flex;justify-content:space-between;align-items:center;font:700 1.15rem "Rajdhani","Segoe UI",sans-serif;letter-spacing:.2em;color:var(--ac);text-shadow:0 0 12px var(--ac);margin-bottom:6px}
.qo{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd)}
.qo .t{flex:1}
.qo .ck{width:22px;height:22px;border:2px solid var(--ac);border-radius:3px;display:grid;place-items:center;flex:none;font-size:.85rem}
.qo.d .ck{background:var(--ok);border-color:var(--ok);color:var(--on)}
.qo.d .t{color:var(--mu);text-decoration:line-through}
.rew{margin-top:10px;font-weight:700;color:#ffc857;letter-spacing:.12em}
#sys{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-20px);opacity:0;z-index:50;min-width:260px;max-width:92vw;padding:12px 18px;background:rgba(4,8,20,.96);border:1px solid var(--ac);box-shadow:0 0 30px var(--glow);text-align:center;transition:.35s;pointer-events:none;border-radius:4px;color:#dbe7ff}
#sys.on{opacity:1;transform:translate(-50%,0)}
#sys b{display:block;letter-spacing:.22em;color:var(--ac);font-size:.78rem}
#sys span{font-size:1.25rem;font-weight:700}
.tip{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}.tip:last-child{border:0}
.tip>span{font-size:1.3rem}.tip b{display:block}
.lg{display:flex;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--bd)}
.lg .pos{width:28px;font-weight:700;font-size:1.2rem;text-align:center}
.lg.me{background:linear-gradient(90deg,var(--glow),transparent)}
.dots{display:flex;align-items:center;gap:4px;margin-top:4px}
.dots span{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--bd)}
.dots .on{background:var(--ok);border-color:var(--ok)}.dots .part{background:var(--ac2);border-color:var(--ac2)}.dots .na{opacity:.25}
:root[data-theme="sombra"]{--bg:#07040f;--card:#120a22;--card2:#170d2c;--tx:#eadfff;--mu:#9a86c4;--ac:#a66bff;--ac2:#ff4fd8;--ok:#43e0a8;--bd:#2c1b4d;--dg:#ff5b7f;--glow:rgba(166,107,255,.38);--on:#0d0620;--navbg:rgba(7,4,15,.92);--bgfx:radial-gradient(900px 420px at 85% -80px,#2a1458 0%,transparent 70%),radial-gradient(700px 400px at 0% 100%,#3a0f3a 0%,transparent 70%)}
:root[data-theme="contraste"]{--bg:#000;--card:#0a0a0a;--card2:#111;--tx:#fff;--mu:#cfcfcf;--ac:#ffe600;--ac2:#00e5ff;--ok:#00ff88;--bd:#777;--dg:#ff6a6a;--glow:rgba(255,230,0,.22);--on:#000;--navbg:#000;--bgfx:linear-gradient(#000,#000)}
body{font-size:1.0625rem}
.emb{vertical-align:middle;flex:none}
@keyframes pulseg{0%,100%{box-shadow:0 0 10px currentColor}50%{box-shadow:0 0 26px currentColor}}
.hud-av.rk-A,.hud-av.rk-S,.hud-av.rk-Monarca{animation:pulseg 2.4s infinite}
.xpbar i{position:relative;overflow:hidden}
.xpbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:sheen 3s infinite}
@keyframes sheen{to{transform:translateX(100%)}}
#fx{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(circle,rgba(4,8,20,.9),rgba(0,0,0,.97));opacity:0;pointer-events:none;transition:opacity .3s;cursor:pointer}
#fx.on{opacity:1;pointer-events:auto}
#fx .box{text-align:center;padding:20px;animation:popfx .6s cubic-bezier(.2,1.4,.4,1);color:#dbe7ff}
#fx .t{letter-spacing:.3em;font:700 .85rem "Rajdhani","Segoe UI",sans-serif;color:var(--ac);margin-top:12px}
#fx .n{font:700 3.4rem "Rajdhani","Segoe UI",sans-serif;text-shadow:0 0 28px var(--ac)}
@keyframes popfx{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.achg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{border:1px solid var(--bd);padding:10px;border-radius:4px;text-align:center;filter:grayscale(1);opacity:.45}
.ach.on{filter:none;opacity:1;border-color:var(--ac);box-shadow:0 0 14px -6px var(--ac)}
.ach span{font-size:1.7rem;display:block}.ach small{display:block;color:var(--mu);font-size:.72rem}
:root[data-rm] *,:root[data-rm] *::after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div class="wrap">
  <div class="topbar"><div><h1>Meu Planner</h1><p class="sub" id="hoje"></p></div><button id="avb" class="avbtn" aria-label="Perfil" onclick="go('perfil')"></button></div>
  <div class="cs" id="cs"></div>
  <div id="hud"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="bnav"></div>
<div id="modal"><div class="bar2"><b id="mt"></b><button class="btn g" onclick="closePdf()">Fechar</button></div><iframe id="mf"></iframe></div>

<script>
var SUPA=window.SUPA_CONFIG||{url:"",key:""};
var TABS=[["home","Hoje"],["metas","Metas"],["arsenal","Arsenal"],["tarefas","Tarefas"],["agenda","Compromissos"],["diario","Diário"],["livros","Leitura"],["grupo","Grupo"],["perfil","Perfil"]];
var tab="home";
var S={goals:[],log:{},tasks:[],events:[],diary:[],books:[]};
try{var raw=localStorage.getItem("planner_v1");if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){S.rev=Date.now();try{localStorage.setItem("planner_v1",JSON.stringify(S))}catch(e){}cloudPush()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function ymd(d){return d.toLocaleDateString("sv")}
function today(){return ymd(new Date())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(d){var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function $(id){return document.getElementById(id)}

/* IndexedDB para PDFs */
var dbp=null;
function idb(){if(dbp)return dbp;dbp=new Promise(function(ok,no){var r=indexedDB.open("planner_pdfs",1);r.onupgradeneeded=function(){r.result.createObjectStore("pdfs")};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}});return dbp}
function tx(mode,fn){return idb().then(function(db){return new Promise(function(ok,no){var t=db.transaction("pdfs",mode),q=fn(t.objectStore("pdfs"));t.oncomplete=function(){ok(q&&q.result)};t.onerror=function(){no(t.error)}})})}

function go(t){tab=t;render();window.scrollTo(0,0);if(t=="grupo"&&cloud.sb&&cuid)loadGroups()}
function render(){
  $("hoje").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("nav").innerHTML=TABS.map(function(t){return '<button class="'+(t[0]==tab?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join("");
  var mais=["mais","livros","tarefas","agenda","diario","perfil"].indexOf(tab)>=0;
  $("bnav").innerHTML=BN.map(function(b){var on=b[0]=="mais"?mais:b[0]==tab;return '<button class="'+(on?"on":"")+'" onclick="go(\''+b[0]+'\')"><i>'+b[1]+'</i>'+b[2]+'</button>'}).join("");
  $("avb").innerHTML=av(S.profile,40);
  var v={home:vHome,metas:vMetas,tarefas:vTarefas,agenda:vAgenda,diario:vDiario,livros:vLivros,arsenal:vArsenal,grupo:vGrupo,perfil:vPerfil,mais:vMais}[tab];
  $("main").innerHTML=v();
  $("hud").innerHTML=hud();applyTheme();postRender();
}

/* ---------- Sincronização ---------- */
var cloud={ref:null,assets:null,t:null};
function setStatus(s){var e=$("cs");if(e)e.textContent={local:"Salvo só neste dispositivo",sync:"☁ Sincronizado",wait:"☁ Sincronizando…",err:"☁ Falha ao sincronizar (dados seguros neste dispositivo)"}[s]}
function typing(){var a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)}
function softRender(){if(!typing())render()}
function cloudPush(){
  if(!cloud.ref){return}
  setStatus("wait");clearTimeout(cloud.t);
  cloud.t=setTimeout(function(){if(!cloud.ref)return;var rv=S.rev;cloud.ref.set({json:JSON.stringify(S),rev:S.rev}).then(function(){cloud.synced=rv;setStatus("sync");if(cloud.pushProfile)cloud.pushProfile().catch(function(){})}).catch(function(){setStatus("err")})},700);
}
function adopt(d){
  var r=JSON.parse(d.json);
  S=Object.assign({goals:[],log:{},tasks:[],events:[],diary:[],books:[]},r);S.rev=d.rev;cloud.synced=d.rev;S.goals=S.goals.map(norm);
  try{localStorage.setItem("planner_v1",JSON.stringify(S))}catch(e){}
  softRender();
}
async function initSync(){
  S.goals=S.goals.map(norm);setStatus("local");try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  try{
    if(!window.claude||!claude.use){await initSupa();return}
    var user=await claude.use("user"),db=await claude.use("db");
    cloud.assets=await claude.use("assets");
    if(!user||!db)return;
    var id=await user.id();if(!id)return;
    cloud.ref=db.collection("data/users/"+id).doc("main");
    var snap=await cloud.ref.get(),d=snap.exists?snap.data():null;
    if(d&&d.json&&d.rev>(S.rev||0))adopt(d);
    else if(!d||d.rev<(S.rev||0))cloudPush();
    setStatus("sync");
    cloud.ref.onSnapshot(function(s){var x=s.exists?s.data():null;if(x&&x.json&&x.rev>(S.rev||0))adopt(x)});
    migratePdfs();softRender();
  }catch(e){setStatus("err")}
}
async function migratePdfs(){
  if(!cloud.assets)return;
  for(var b of S.books.slice()){
    if(b.asset)continue;
    try{var blob=await tx("readonly",function(s){return s.get(b.id)});if(!blob)continue;var r=await cloud.assets.upload(blob);b.asset=r.id;save()}catch(e){}
  }
}

/* ---------- Metas ---------- */
var COLORS=["#c4895a","#9bb07a","#b89b6a","#a8786b","#8ea3a8","#c9605a"];
var EMOJIS=["📖","💧","🏃","🧠","💻","🛌","🍎","💰","🧘","🎯"];
var DN=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
var TYPES={quant:["Quantidade","Contar até um valor: páginas, copos, exercícios"],tempo:["Tempo","Minutos dedicados: estudo, treino, leitura"],sim:["Feito / não feito","Hábito de marcar uma vez no dia"],max:["Limite máximo","Ficar abaixo de um valor: redes sociais, gastos"],lista:["Checklist","Vários itens que formam a rotina do dia"]};
var G=null;
function norm(g){return Object.assign({type:"quant",emoji:"🎯",color:COLORS[0],step:1,days:[0,1,2,3,4,5,6],items:[],unit:""},g)}
function gOf(id){return S.goals.find(function(g){return g.id==id})}
function gval(d,id){return (S.log[d]&&S.log[d][id])||0}
function gnum(g,d){var v=gval(d,g.id);return Array.isArray(v)?v.length:v}
function gok(g,d){var n=gnum(g,d);return g.type=="max"?n<=g.target:n>=g.target}
function gfrac(g,d){var n=gnum(g,d);return g.type=="max"?(n<=g.target?1:0):Math.min(1,n/g.target)}
function active(g,d){return g.days.indexOf(new Date(d+"T12:00:00").getDay())>=0}
function pctDay(d){var a=S.goals.filter(function(g){return active(g,d)});if(!a.length)return 0;return Math.round(100*a.reduce(function(s,g){return s+gfrac(g,d)},0)/a.length)}
function r2(n){return Math.round(n*100)/100}
function fmtN(n){return String(r2(n)).replace(".",",")}
function num(v){return Number(String(v).replace(",","."))||0}
function setG(id,v){var d=today(),g=gOf(id);if(typeof v=="number"){v=Math.max(0,r2(v));if(g&&g.type!="max")v=Math.min(v,g.target)}S.log[d]=S.log[d]||{};S.log[d][id]=v;save();render()}
function incG(id,n){setG(id,Math.max(0,gnum(gOf(id),today())+n))}
function togG(id){setG(id,gval(today(),id)?0:1)}
function togItem(id,i){var a=gval(today(),id);a=Array.isArray(a)?a.slice():[];var k=a.indexOf(i);if(k<0)a.push(i);else a.splice(k,1);setG(id,a)}

function newDraft(g){G=g?JSON.parse(JSON.stringify(g)):norm({name:"",target:1,items:[]})}
function setType(k){G.type=k;if(k=="tempo"){G.step=10;G.unit="min";if(Number(G.target)<5)G.target=30}else if(k!="lista")G.step=1;render()}
function setDays(a){G.days=a;render()}
function togDay(i){var k=G.days.indexOf(i);if(k<0)G.days.push(i);else G.days.splice(k,1);G.days.sort();render()}
function setCol(c){G.color=c;render()}
function setEmo(e){G.emoji=e;render()}
function editGoal(id){newDraft(gOf(id));render();window.scrollTo(0,0)}
function cancelGoal(){G=null;render()}
function delGoal(id){if(!confirm("Remover esta meta?"))return;S.goals=S.goals.filter(function(g){return g.id!=id});save();render()}
function saveGoal(){
  var g=G;g.name=g.name.trim();
  if(!g.name){alert("Dê um nome à meta.");return}
  if(g.type=="lista"){if(!g.items.length){alert("Adicione ao menos um item.");return}g.target=g.items.length}
  else if(g.type=="sim")g.target=1;
  else if(!(Number(g.target)>0)){alert("Informe um valor maior que zero.");return}
  if(!g.days.length){alert("Escolha ao menos um dia da semana.");return}
  g.target=Number(g.target);g.step=Number(g.step)||1;
  if(g.id)S.goals=S.goals.map(function(x){return x.id==g.id?g:x});else{g.id=uid();S.goals.push(g)}
  G=null;save();render();
}
var UNITS=[["L","Litros (L)",0.25],["ml","Mililitros (ml)",100],["km","Quilômetros (km)",0.5],["m","Metros (m)",100],["kg","Quilos (kg)",0.5],["g","Gramas (g)",50],["h","Horas (h)",0.5],["kcal","Calorias (kcal)",50],["R$","Reais (R$)",10],["páginas","Páginas",1],["copos","Copos",1],["passos","Passos",500],["vezes","Vezes",1]];
function isPreset(u){return UNITS.some(function(x){return x[0]==u})}
function setUnit(v){if(v=="__outra"){G.unitCustom=true;G.unit=""}else{G.unitCustom=false;G.unit=v;var p=UNITS.find(function(x){return x[0]==v});if(p)G.step=p[2]}render()}
function unitForm(T){
  var cust=G.unitCustom||(G.unit&&!isPreset(G.unit)),sel=cust?"__outra":G.unit;
  var o='<option value=""'+(sel==""?" selected":"")+'>Sem unidade</option>'+UNITS.map(function(x){return '<option value="'+x[0]+'"'+(sel==x[0]?" selected":"")+'>'+x[1]+'</option>'}).join("")+'<option value="__outra"'+(cust?" selected":"")+'>Outra…</option>';
  return '<div class="row">'+fld(T=="max"?"Limite por dia":"Meta por dia",'<input type="number" step="any" min="0" value="'+esc(G.target)+'" style="width:110px" oninput="G.target=this.value">')+fld("Unidade",'<select onchange="setUnit(this.value)">'+o+'</select>')+(cust?fld("Nome da unidade",'<input value="'+esc(G.unit)+'" placeholder="Ex.: sessões" style="width:140px" oninput="G.unit=this.value">'):"")+fld("Passo dos botões +/−",'<input type="number" step="any" min="0" value="'+esc(G.step)+'" style="width:100px" oninput="G.step=this.value">')+'</div><div class="mu" style="margin-top:6px">Aceita decimais, como 2,5 (digite 2.5 se o campo pedir ponto).</div>';
}
function fld(l,i){return '<div><label class="lb">'+l+'</label>'+i+'</div>'}
function dayTxt(d){var s=d.join();return d.length==7?"Todos os dias":s=="1,2,3,4,5"?"Dias úteis":s=="0,6"?"Fins de semana":d.map(function(i){return DN[i]}).join(", ")}
function goalDesc(g){
  if(g.type=="sim")return "Feito / não feito";
  if(g.type=="lista")return "Checklist de "+g.items.length+" itens";
  var u=g.type=="tempo"?"min":g.unit;
  return (g.type=="max"?"Máximo de ":"Meta: ")+fmtN(g.target)+" "+u+" por dia";
}
function vMetas(){
  if(!G)newDraft();
  var T=G.type,h='<div class="card"><h2>'+(G.id?"Editar meta":"Nova meta")+'</h2><div class="types">';
  Object.keys(TYPES).forEach(function(k){h+='<button class="tp'+(k==T?" on":"")+'" onclick="setType(\''+k+'\')"><b>'+TYPES[k][0]+'</b><span>'+TYPES[k][1]+'</span></button>'});
  h+='</div><div class="row">'+fld("Ícone",'<input value="'+esc(G.emoji)+'" style="width:64px;text-align:center" oninput="G.emoji=this.value">')+'<div style="flex:1;min-width:180px">'+fld("Nome da meta",'<input class="grow" style="width:100%" value="'+esc(G.name)+'" placeholder="Ex.: Ler, Beber água, Estudar inglês" oninput="G.name=this.value">')+'</div></div>';
  h+='<label class="lb">Ícones rápidos</label><div class="row">'+EMOJIS.map(function(e){return '<button class="chip" onclick="setEmo(\''+e+'\')">'+e+'</button>'}).join("")+'</div>';
  h+='<label class="lb">Cor</label><div class="row">'+COLORS.map(function(c){return '<button class="sw'+(c==G.color?" on":"")+'" aria-label="Cor" style="background:'+c+'" onclick="setCol(\''+c+'\')"></button>'}).join("")+'</div>';
  if(T=="quant"||T=="max")h+=unitForm(T);
  if(T=="tempo")h+='<div class="row">'+fld("Meta por dia (minutos)",'<input type="number" min="1" value="'+esc(G.target)+'" style="width:130px" oninput="G.target=this.value">')+fld("Passo dos botões",'<select onchange="G.step=this.value">'+[5,10,15,30,60].map(function(n){return '<option'+(n==G.step?" selected":"")+'>'+n+'</option>'}).join("")+'</select>')+'</div>';
  if(T=="lista")h+=fld("Itens do checklist (um por linha)",'<textarea placeholder="Arrumar a cama&#10;Revisar a agenda&#10;Ler 10 páginas" oninput="G.items=this.value.split(\'\\n\').map(function(x){return x.trim()}).filter(Boolean)">'+esc(G.items.join("\n"))+'</textarea>');
  h+='<label class="lb">Dias da semana</label><div class="row">'+DN.map(function(n,i){return '<button class="chip'+(G.days.indexOf(i)>=0?" on":"")+'" onclick="togDay('+i+')">'+n+'</button>'}).join("")+'<button class="chip" onclick="setDays([0,1,2,3,4,5,6])">Todos</button><button class="chip" onclick="setDays([1,2,3,4,5])">Úteis</button><button class="chip" onclick="setDays([0,6])">Fim de semana</button></div>';
  h+='<div class="row" style="margin-top:16px"><button class="btn" onclick="saveGoal()">'+(G.id?"Salvar alterações":"Adicionar meta")+'</button>'+(G.id?'<button class="btn g" onclick="cancelGoal()">Cancelar</button>':'')+'</div></div>';
  h+='<div class="card"><h2>Minhas metas</h2>';
  if(!S.goals.length)h+='<div class="empty">Nenhuma meta ainda. Crie a primeira acima.</div>';
  S.goals.forEach(function(g){h+='<div class="item"><div class="t"><b><span style="color:'+g.color+'">'+esc(g.emoji)+'</span> '+esc(g.name)+'</b><div class="mu">'+goalDesc(g)+' · '+dayTxt(g.days)+'</div></div><button class="btn g" onclick="editGoal(\''+g.id+'\')">Editar</button><button class="btn x" onclick="delGoal(\''+g.id+'\')">Remover</button></div>'});
  return h+'</div>';
}
function todayGoals(t){
  var a=S.goals.filter(function(g){return active(g,t)});
  if(!a.length)return '<div class="empty">'+(S.goals.length?"Nenhuma meta para hoje.":"Crie metas na aba Metas.")+'</div>';
  return a.map(function(g){
    var n=gnum(g,t),p=Math.min(100,Math.round(100*n/g.target)),over=g.type=="max"&&n>g.target,ok=gok(g,t),u=g.type=="tempo"?"min":g.unit,id="'"+g.id+"'";
    var st=g.type=="sim"?(n?"Feito":"Pendente"):(g.type=="max"?fmtN(n)+" / máx. "+fmtN(g.target):fmtN(n)+" / "+fmtN(g.target))+" "+esc(u);
    var h='<div style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><b><span style="color:'+g.color+'">'+esc(g.emoji)+'</span> '+esc(g.name)+'</b><span class="mu">'+st+'</span></div><div class="bar"><i style="width:'+p+'%;background:'+(over?"var(--dg)":ok?"var(--ok)":g.color)+'"></i></div>';
    if(g.type=="sim")h+='<button class="btn'+(n?" g":"")+'" onclick="togG('+id+')">'+(n?"Desmarcar":"Marcar como feito")+'</button>';
    else if(g.type=="lista"){var v=gval(t,g.id);v=Array.isArray(v)?v:[];h+=g.items.map(function(it,i){return '<label class="item" style="padding:6px 0"><input type="checkbox" '+(v.indexOf(i)>=0?"checked":"")+' onchange="togItem('+id+','+i+')"><span class="t">'+esc(it)+'</span></label>'}).join("")}
    else{var cap=g.type!="max",st2=fmtN(g.step);h+='<div class="row"><button class="btn g" '+(n<=0?"disabled":"")+' onclick="incG('+id+',-'+g.step+')">−'+st2+'</button><button class="btn g" '+(cap&&n>=g.target?"disabled":"")+' onclick="incG('+id+','+g.step+')">+'+st2+'</button><input type="number" step="any" min="0"'+(cap?' max="'+g.target+'"':"")+' value="'+r2(n)+'" style="width:90px" onchange="setG('+id+',num(this.value))"></div>'+(cap&&n>=g.target?'<div class="mu" style="margin-top:6px">Meta de hoje concluída ✓</div>':"")+(over?'<div class="mu" style="margin-top:6px;color:var(--dg)">Você passou do limite de hoje</div>':"")}
    return h+'</div>';
  }).join("");
}

/* ---------- Tarefas ---------- */
function addTask(){var t=$("tt").value.trim();if(!t)return;S.tasks.push({id:uid(),text:t,done:null,created:today()});save();render()}
function togTask(id){var t=S.tasks.find(function(x){return x.id==id});t.done=t.done?null:today();save();render()}
function delTask(id){S.tasks=S.tasks.filter(function(t){return t.id!=id});save();render()}
function clearDone(){S.tasks=S.tasks.filter(function(t){return !t.done});save();render()}
function taskRow(t){return '<div class="item '+(t.done?"done":"")+'"><input type="checkbox" '+(t.done?"checked":"")+' onchange="togTask(\''+t.id+'\')"><div class="t">'+esc(t.text)+'</div><button class="btn x" onclick="delTask(\''+t.id+'\')">✕</button></div>'}
function vTarefas(){
  var h='<div class="card"><h2>Nova tarefa</h2><div class="row"><input id="tt" class="grow" placeholder="O que precisa ser feito?" onkeydown="if(event.key===\'Enter\')addTask()"><button class="btn" onclick="addTask()">Adicionar</button></div></div><div class="card"><div class="row" style="justify-content:space-between"><h2>Lista de tarefas</h2><button class="btn g" onclick="clearDone()">Limpar concluídas</button></div>';
  if(!S.tasks.length)h+='<div class="empty">Sem tarefas por aqui.</div>';
  S.tasks.filter(function(t){return !t.done}).forEach(function(t){h+=taskRow(t)});
  S.tasks.filter(function(t){return t.done}).forEach(function(t){h+=taskRow(t)});
  return h+'</div>';
}

/* ---------- Compromissos ---------- */
function addEv(){var t=$("et").value.trim(),d=$("ed").value,h=$("eh").value;if(!t||!d)return;S.events.push({id:uid(),title:t,date:d,time:h});save();render()}
function delEv(id){S.events=S.events.filter(function(e){return e.id!=id});save();render()}
function evSorted(){return S.events.slice().sort(function(a,b){return (a.date+(a.time||"")).localeCompare(b.date+(b.time||""))})}
function evRow(e){return '<div class="item"><div class="t"><b>'+esc(e.title)+'</b><div class="mu">'+fmt(e.date)+(e.time?" às "+e.time:"")+'</div></div><button class="btn x" onclick="delEv(\''+e.id+'\')">✕</button></div>'}
function vAgenda(){
  var t=today(),all=evSorted(),up=all.filter(function(e){return e.date>=t}),past=all.filter(function(e){return e.date<t}).reverse();
  var h='<div class="card"><h2>Novo compromisso</h2><div class="row"><input id="et" class="grow" placeholder="Título"><input id="ed" type="date" value="'+t+'"><input id="eh" type="time"><button class="btn" onclick="addEv()">Marcar</button></div></div>';
  h+='<div class="card"><h2>Próximos</h2>'+(up.length?up.map(evRow).join(""):'<div class="empty">Nenhum compromisso futuro.</div>')+'</div>';
  if(past.length)h+='<div class="card"><h2>Anteriores</h2>'+past.slice(0,10).map(evRow).join("")+'</div>';
  return h;
}

/* ---------- Diário ---------- */
function addNote(){var t=$("dn").value.trim();if(!t)return;S.diary.unshift({id:uid(),date:today(),time:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),text:t});save();render()}
function delNote(id){if(!confirm("Apagar esta anotação?"))return;S.diary=S.diary.filter(function(n){return n.id!=id});save();render()}
function vDiario(){
  var h='<div class="card"><h2>Nova anotação</h2><textarea id="dn" placeholder="Lembretes, ideias, como foi o dia..."></textarea><div style="margin-top:8px"><button class="btn" onclick="addNote()">Salvar no diário</button></div></div><div class="card"><h2>Anotações</h2>';
  if(!S.diary.length)h+='<div class="empty">Seu diário está vazio.</div>';
  S.diary.forEach(function(n){h+='<div class="item" style="align-items:flex-start"><div class="t"><div class="mu">'+fmt(n.date)+' · '+n.time+'</div><div style="white-space:pre-wrap">'+esc(n.text)+'</div></div><button class="btn x" onclick="delNote(\''+n.id+'\')">✕</button></div>'});
  return h+'</div>';
}

/* ---------- Biblioteca ---------- */
var ST={quero:"Quero ler",lendo:"Lendo",pausa:"Em pausa",lido:"Já li"};
var KINDS={trecho:["📌","Trecho"],citacao:["❝","Citação"],ideia:["💡","Ideia"],duvida:["❓","Dúvida"],vocab:["🔤","Vocabulário"]};
var RB=null,RF="todos",RQ="",MF="todas",mk={page:"",kind:"trecho",text:"",note:""},curUrl=null;
function bk(b){b.pages=b.pages||0;b.cur=b.cur||0;b.rating=b.rating||0;b.review=b.review||"";b.marks=b.marks||[];b.log=b.log||{};return b}
function bookOf(id){var b=S.books.find(function(x){return x.id==id});return b&&bk(b)}
function hasPdf(b){return !!b.asset||!b.nofile}
function rlog(){S.rlog=S.rlog||{};return S.rlog}
function pagesOn(d){return rlog()[d]||0}
function streak(){var n=0,d=new Date();if(!pagesOn(ymd(d)))d.setDate(d.getDate()-1);while(pagesOn(ymd(d))>0){n++;d.setDate(d.getDate()-1)}return n}
function lab7(days){return days.map(function(d){return new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short"}).slice(0,3)})}
function setQ(v){RQ=v;render();var e=$("rq");e.focus();e.setSelectionRange(v.length,v.length)}
function setB(id,k,v){
  var b=bookOf(id);b[k]=v;
  if(k=="cur"&&b.pages&&b.cur>=b.pages){b.status="lido";b.finished=b.finished||today()}
  if(k=="status"){if(v=="lendo"&&!b.started)b.started=today();if(v=="lido"){b.finished=b.finished||today();if(b.pages)b.cur=b.pages}}
  save();render();
}
function logRead(id){
  var n=Number($("rn").value);if(!(n>0))return;
  var b=bookOf(id),d=today();
  b.log[d]=(b.log[d]||0)+n;rlog()[d]=pagesOn(d)+n;
  b.cur=b.pages?Math.min(b.pages,b.cur+n):b.cur+n;
  if(!b.started)b.started=d;
  if(b.status=="quero"||b.status=="pausa")b.status="lendo";
  if(b.pages&&b.cur>=b.pages){b.status="lido";b.finished=b.finished||d}
  save();render();
}
function addMark(id){
  var b=bookOf(id);
  if(!mk.text.trim()&&!mk.note.trim()){alert("Escreva o trecho ou uma anotação.");return}
  b.marks.unshift({id:uid(),page:mk.page,kind:mk.kind,text:mk.text.trim(),note:mk.note.trim(),date:today(),fav:false});
  mk={page:"",kind:mk.kind,text:"",note:""};save();render();
}
function favMark(id,mid){var m=bookOf(id).marks.find(function(x){return x.id==mid});m.fav=!m.fav;save();render()}
function delMark(id,mid){if(!confirm("Apagar esta marcação?"))return;var b=bookOf(id);b.marks=b.marks.filter(function(x){return x.id!=mid});save();render()}
function exportMarks(id){
  var b=bookOf(id),s=b.title+(b.author?" — "+b.author:"")+"\n\n"+b.marks.slice().reverse().map(function(m){return "["+KINDS[m.kind][1]+(m.page?", pág. "+m.page:"")+"] "+m.text+(m.note?"\n→ "+m.note:"")}).join("\n\n");
  try{navigator.clipboard.writeText(s).then(function(){alert("Marcações copiadas.")},function(){prompt("Copie o texto:",s)})}catch(e){prompt("Copie o texto:",s)}
}
function addBook(){
  var f=$("bf").files[0],t=$("bt").value.trim()||(f?f.name.replace(/\.pdf$/i,""):"");
  if(!t){alert("Informe o título ou escolha um PDF.");return}
  var o={id:uid(),title:t,author:$("ba").value.trim(),status:$("bs").value,pages:Number($("bp").value)||0,added:today(),nofile:!f},btn=$("bb");
  var done=function(a){o.asset=a||null;if(o.status=="lendo")o.started=today();S.books.unshift(bk(o));save();render()};
  if(!f){done();return}
  o.size=f.size;btn.disabled=true;btn.textContent="Enviando…";
  var fail=function(){btn.disabled=false;btn.textContent="Guardar";alert("Não consegui guardar o PDF (limite de 20 MB por arquivo).")};
  if(cloud.assets)cloud.assets.upload(f).then(function(r){done(r.id)}).catch(fail);
  else tx("readwrite",function(s){return s.put(f,o.id)}).then(function(){done()}).catch(fail);
}
function delBook(id){
  if(!confirm("Remover este livro e todas as suas marcações?"))return;
  var b=S.books.find(function(x){return x.id==id});
  var rm=function(){S.books=S.books.filter(function(x){return x.id!=id});RB=null;save();render()};
  if(b&&b.asset&&cloud.assets)cloud.assets.delete(b.asset).catch(function(){});
  tx("readwrite",function(s){return s.delete(id)}).then(rm).catch(rm);
}
function openPdf(id){
  var b=bookOf(id),pg="#page="+(b.cur||1);$("mt").textContent=b.title;
  if(b.asset&&cloud.urlFor){cloud.urlFor(b.asset).then(function(u){$("mf").src=u+pg;$("modal").className="on"}).catch(function(){alert("Não consegui abrir o PDF.")});return}
  if(b.asset){$("mf").src="/_blob/"+b.asset+pg;$("modal").className="on";return}
  tx("readonly",function(s){return s.get(id)}).then(function(blob){if(!blob){alert("Arquivo não encontrado neste dispositivo.");return}curUrl=URL.createObjectURL(blob);$("mf").src=curUrl+pg;$("modal").className="on"});
}
function closePdf(){$("modal").className="";$("mf").src="about:blank";if(curUrl)URL.revokeObjectURL(curUrl)}

function vLivros(){
  if(RB&&bookOf(RB))return vBook(RB);RB=null;
  var t=today(),days=last7(),vals=days.map(pagesOn),mx=Math.max.apply(null,vals.concat([1])),g=S.rgoal||10,td=pagesOn(t),p=Math.min(100,Math.round(100*td/g));

  cloud.urlFor=async function(path){var r=await sb.storage.from("pdfs").createSignedUrl(path,3600);if(r.error)throw r.error;return r.data.signedUrl};

    if(d&&d.rev>(S.rev||0))adopt(d);else if(!d||d.rev<(S.rev||0))cloudPush();

  cloud.ch=sb.channel("ps-"+me).on("postgres_changes",{event:"*",schema:"public",table:"planner_state",filter:"user_id=eq."+me},function(p){var d=p.new;if(d&&Number(d.rev)>(S.rev||0))adopt({json:JSON.stringify(d.data),rev:Number(d.rev)})}).subscribe();

  if(gn&&!(S.profile&&S.profile.name)){S.profile=S.profile||{};S.profile.name=gn;save()}

  migratePdfs();softRender();
}

function imgCanvas(file,max,square){
  return new Promise(function(ok,no){
    var r=new FileReader();
    r.onerror=no;
    r.onload=function(){var im=new Image();im.onerror=no;im.onload=function(){
      var w=im.width,h=im.height,sx=0,sy=0,sw=w,sh=h,c=document.createElement("canvas");
      if(square){var m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;c.width=c.height=max}
      else{var k=Math.min(1,max/Math.max(w,h));c.width=Math.round(w*k);c.height=Math.round(h*k)}
      c.getContext("2d").drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);ok(c)};im.src=r.result};
    r.readAsDataURL(file);
  });
}

/* ---------- Sistema (XP, níveis, missões, arsenal, liga) ---------- */
var XPV={meta:20,tarefa:10,pagina:1,marca:5,diario:5,treino:15,missao:60},TD=null,LG="sem";
var TITLES={E:"Novato",D:"Desperto",C:"Combatente",B:"Elite",A:"Veterano",S:"Lendário",Monarca:"Monarca"};
function zh(i,t){return '<div class="zh"><span>'+i+'</span>'+t+'</div>'}
function gdone(g,d){var e=S.log[d]&&S.log[d][g.id];return g.type=="max"?(e!==undefined&&gok(g,d)):(gok(g,d)&&gnum(g,d)>0)}
function xpMap(){
  var m={};function add(d,v){if(d)m[d]=(m[d]||0)+v}
  Object.keys(S.log).forEach(function(d){S.goals.forEach(function(g){if(gdone(g,d))add(d,XPV.meta)})});
  S.tasks.forEach(function(t){if(t.done)add(t.done,XPV.tarefa)});
  var rl=rlog();Object.keys(rl).forEach(function(d){add(d,Math.min(rl[d],100)*XPV.pagina)});
  S.books.forEach(function(b){(b.marks||[]).forEach(function(k){add(k.date,XPV.marca)})});
  var dd={};S.diary.forEach(function(n){if(!dd[n.date]){dd[n.date]=1;add(n.date,XPV.diario)}});
  var tl=S.tlog||{};Object.keys(tl).forEach(function(d){add(d,XPV.treino*tl[d].length)});
  var qd=S.qdone||{};Object.keys(qd).forEach(function(d){add(d,XPV.missao)});
  return m;
}
function totalXP(){var m=xpMap(),t=0;for(var k in m)t+=m[k];return t}
function weekXP(){var m=xpMap(),t=0;last7().forEach(function(d){t+=m[d]||0});return t}
function lvlInfo(xp){var L=Math.floor(Math.sqrt(xp/50))+1,a=50*(L-1)*(L-1),b=50*L*L;return {L:L,xp:xp,cur:xp-a,need:b-a,pct:Math.round(100*(xp-a)/(b-a))}}
function rankOf(L){return L>=50?"Monarca":L>=30?"S":L>=20?"A":L>=15?"B":L>=10?"C":L>=5?"D":"E"}
function hud(){
  var I=lvlInfo(totalXP()),p=S.profile||{},rk=rankOf(I.L);
  return '<div class="hud"><div class="hud-av rk-'+rk+'">'+av(p,52)+'</div><div class="hud-b"><div class="hud-t"><b>'+esc(p.name||"Caçador")+'</b>'+emblem(rk,32)+'</div><div class="hud-l">Nível <b>'+I.L+'</b> · '+TITLES[rk]+'</div><div class="xpbar"><i style="width:'+I.pct+'%"></i></div><div class="hud-x">'+I.cur+' / '+I.need+' XP para o nível '+(I.L+1)+'</div></div></div>';
}
function sys(title,msg){

function postRender(){
  var t=today(),q=questFor(t);S.qdone=S.qdone||{};

/* missão diária */
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function treinosHoje(){var w=new Date().getDay();return (S.treinos||[]).filter(function(t){return t.days.indexOf(w)>=0})}
function questFor(d){
  var L=lvlInfo(totalXP()).L,act=S.goals.filter(function(g){return active(g,d)}),seed=hashStr(d+(cuid||"x")+S.goals.length),O=[];
  if(act.length){
    var n=Math.max(1,Math.ceil(act.length*Math.min(1,.5+L*.025))),c=act.filter(function(g){return gdone(g,d)}).length;
    O.push({t:"Cumpra "+n+" de "+act.length+" metas de hoje",c:Math.min(n,c),m:n});
  }else O.push({t:"Crie sua primeira meta na aba Metas",c:S.goals.length?1:0,m:1});
  if(act.length>1){var f=act[seed%act.length];O.push({t:"Foco do dia: conclua "+f.emoji+" "+f.name,c:gdone(f,d)?1:0,m:1})}
  var lendo=S.books.some(function(b){return b.status=="lendo"}),td=S.tasks.filter(function(x){return x.done==d}).length,tp=S.tasks.filter(function(x){return !x.done}).length;
  if(lendo){var pg=S.rgoal||10;O.push({t:"Leia "+pg+" páginas",c:Math.min(pg,pagesOn(d)),m:pg})}
  else if(tp+td>0){var nt=Math.min(2,tp+td);O.push({t:"Conclua "+nt+" tarefa(s)",c:Math.min(nt,td),m:nt})}
  var P=[],th=treinosHoje();
  if(th.length)P.push({t:"Faça o treino: "+th[0].name,c:(S.tlog&&S.tlog[d]&&S.tlog[d].length)?1:0,m:1});
  P.push({t:"Escreva uma anotação no diário",c:S.diary.some(function(n){return n.date==d})?1:0,m:1});
  if(lendo)P.push({t:"Salve 1 marcação de leitura",c:S.books.some(function(b){return (b.marks||[]).some(function(k){return k.date==d})})?1:0,m:1});
  if(O.length<4)O.push(P[seed%P.length]);
  O.forEach(function(o){o.d=o.c>=o.m});
  return {objs:O,done:O.every(function(o){return o.d})};
}
function questCard(){
  var t=today(),q=questFor(t),rk=rankOf(lvlInfo(totalXP()).L),done=S.qdone&&S.qdone[t];
  return '<div class="card quest"><div class="qh"><span>[ MISSÃO DIÁRIA ]</span><span class="rk rk-'+rk+'">RANK '+rk+'</span></div><div class="mu">'+(done?"Missão cumprida. Descanse, Caçador.":"O Sistema montou o seu treinamento de hoje com base nas suas metas e rotinas.")+'</div>'+q.objs.map(function(o){return '<div class="qo'+(o.d?" d":"")+'"><span class="ck">'+(o.d?"✓":"")+'</span><span class="t">'+esc(o.t)+'</span><span class="mu">'+o.c+'/'+o.m+'</span></div>'}).join("")+'<div class="rew">RECOMPENSA: +'+XPV.missao+' XP'+(done?" ✓":"")+'</div></div>';
}

/* dicas personalizadas */
function dicas(){
  var T=[],t=today(),days=last7(),I=lvlInfo(totalXP()),i;
  S.goals.forEach(function(g){
    if(g.type=="max")return;
    var a=days.filter(function(d){return active(g,d)});if(a.length<3)return;
    var r=a.filter(function(d){return gfrac(g,d)>=1}).length/a.length,u=g.type=="tempo"?"min":g.unit;
    if(r<.4)T.push(["⚠️",esc(g.name)+" está pesada","Você cumpriu só "+Math.round(r*100)+"% dos dias. Reduza a meta para "+fmtN(g.target*.7)+" "+esc(u)+" por uma semana e volte a subir aos poucos."]);
    else if(r>=.9&&(g.type=="quant"||g.type=="tempo"))T.push(["🚀","Hora de evoluir "+esc(g.name),"Quase todos os dias cumpridos. Que tal subir a meta para "+fmtN(Math.ceil(g.target*1.15*4)/4)+" "+esc(u)+"?"]);
  });
  var gs=gstreak();
  if(gs>=3)T.push(["🔥","Sequência de "+gs+" dias","Não quebre a corrente: mesmo uma versão mínima das metas mantém a sequência."]);
  else if(S.goals.length&&gs==0)T.push(["🌱","Recomece pequeno","Complete só a meta mais fácil hoje. Consistência vale mais que intensidade."]);
  var wd=[0,0,0,0,0,0,0],wn=[0,0,0,0,0,0,0];
  for(i=1;i<=28;i++){var dd=new Date();dd.setDate(dd.getDate()-i);var k=ymd(dd);if(S.goals.some(function(g){return active(g,k)})){wd[dd.getDay()]+=pctDay(k);wn[dd.getDay()]++}}
  var best=-1,low=101;for(i=0;i<7;i++)if(wn[i]>=2&&wd[i]/wn[i]<low){low=wd[i]/wn[i];best=i}
  if(best>=0&&low<50)T.push(["📅","Seu ponto fraco: "+DN[best],"Nesse dia você costuma cumprir só "+Math.round(low)+"% das metas. Planeje metas leves ou adiante parte delas na véspera."]);
  var lendo=S.books.map(bk).filter(function(b){return b.status=="lendo"}),rl=rlog(),lr=Object.keys(rl).filter(function(d){return rl[d]>0}).sort().pop();
  if(lendo.length){
    var ds=lr?Math.round((new Date(t)-new Date(lr))/864e5):99;
    if(ds>=3)T.push(["📚","Leitura parada",(ds>=99?"Você ainda não registrou leitura. ":"Faz "+ds+" dias sem ler. ")+"Leia só 5 páginas de “"+esc(lendo[0].title)+"” para reativar o hábito."]);
    lendo.some(function(b){
      var r14=0;for(var j=0;j<14;j++){var x=new Date();x.setDate(x.getDate()-j);r14+=b.log[ymd(x)]||0}
      if(b.pages&&b.cur<b.pages&&r14>0){T.push(["⏳","Previsão de “"+esc(b.title)+"”","Neste ritmo você termina em cerca de "+Math.ceil((b.pages-b.cur)/(r14/14))+" dias."]);return true}
    });
  }
  var tr=S.treinos||[];
  if(!tr.length)T.push(["🏋️","Ganhe XP com treinos","Cadastre uma rotina no Arsenal: cada treino concluído rende +"+XPV.treino+" XP."]);
  else{var lt=Object.keys(S.tlog||{}).filter(function(d){return S.tlog[d].length}).sort().pop(),d2=lt?Math.round((new Date(t)-new Date(lt))/864e5):99;
    if(d2>=4)T.push(["🏋️","Hora de treinar",(d2>=99?"Nenhum treino concluído ainda. ":"Seu último treino foi há "+d2+" dias. ")+"Comece com a versão curta de 15 minutos."])}
  var pend=S.tasks.filter(function(x){return !x.done}).length;
  if(pend>5)T.push(["✅","Muitas tarefas abertas","Você tem "+pend+" pendentes. Escolha só as 3 mais importantes para hoje."]);
  var nx=evSorted().filter(function(e){return e.date>=t}).shift();
  if(nx&&(new Date(nx.date)-new Date(t))/864e5<=1)T.push(["🗓️","Compromisso próximo","“"+esc(nx.title)+"” é "+(nx.date==t?"hoje":"amanhã")+(nx.time?" às "+nx.time:"")+". Adiante suas metas para não correr depois."]);
  T.push(["⚡","Rumo ao nível "+(I.L+1),"Faltam "+(I.need-I.cur)+" XP. Cada meta cumprida rende "+XPV.meta+" XP e a missão diária rende "+XPV.missao+"."]);
  return T.slice(0,6).map(function(x){return '<div class="tip"><span>'+x[0]+'</span><div><b>'+x[1]+'</b><span class="mu">'+x[2]+'</span></div></div>'}).join("");
}

function achCtx(){

  var pend=S.tasks.filter(function(x){return !x.done});
  h+=pend.length?pend.slice(0,6).map(taskRow).join(""):'<div class="empty">Tudo em dia. 🎉</div>';
  h+='<h2 style="margin-top:14px">Compromissos de hoje</h2>';
  var ev=evSorted().filter(function(e){return e.date==t});
  h+=ev.length?ev.map(evRow).join(""):'<div class="empty">Nada marcado para hoje.</div>';
  h+='</div></div><div class="grid"><div class="card"><h2>Metas cumpridas (últimos 7 dias)</h2>'+chart("Metas cumpridas",days.map(pctDay),lab,100,"%")+'</div>';
  var tc=days.map(function(d){return S.tasks.filter(function(x){return x.done==d}).length}),mx=Math.max.apply(null,tc.concat([1]));
  h+='<div class="card"><h2>Tarefas concluídas (últimos 7 dias)</h2>'+chart("Tarefas concluídas",tc,lab,mx,"")+'</div></div>';
  return accountCard()+h+backupCard();
}
initSync();
render();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")==0)navigator.serviceWorker.register("sw.js").catch(function(){});
window.addEventListener("online",function(){if(cloud.ref&&S.rev>(cloud.synced||0))cloudPush()});
setInterval(checkReminders,30000);
</script>
